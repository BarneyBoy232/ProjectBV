name = "projectbv-agent-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The public Firebase web config — NOT secrets (same values the agent embeds).
[vars]
FIREBASE_PROJECT_ID = "runik-77e07"
# The PUBLIC Firebase web apiKey (not a secret; same value in INTEGRATION.md and the
# web app). Paste it here before `wrangler deploy`, or set it with
# `wrangler secret put FIREBASE_API_KEY`.
FIREBASE_API_KEY = "PASTE_PUBLIC_FIREBASE_WEB_API_KEY"

# API keys + the audit log live here. Create it once with:
#   wrangler kv namespace create AGENTAPI_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "AGENTAPI_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets — set with `wrangler secret put <NAME>` (never commit these):
#   AGENTAPI_TOKEN  must EQUAL agentApiToken in internal/config/embedded-config.json
#   ADMIN_TOKEN     a long random string; the dashboard uses it to mint/list keys
